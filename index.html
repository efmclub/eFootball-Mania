<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFootball Mania</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(180deg,#06142b,#08192f,#0a2545);
    color:white;
    text-align:center;
}

header{
    background:#08192f;
    padding:20px;
    border-bottom:2px solid #00c3ff;
    box-shadow:0 0 20px rgba(0,195,255,0.3);
}

.logo{
    width:170px;
    height:auto;
    display:block;
    margin:0 auto 15px;
}

h1{
    font-size:38px;
    color:#00bfff;
}

nav{
    margin-top:20px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:#00d4ff;
}

.hero{
    padding:120px 20px;
    background:linear-gradient(180deg,#06142b,#0d2348);
    text-align:center;
}

.hero h1{
    font-size:56px;
    color:#00c3ff;
    text-shadow:0 0 15px rgba(0,195,255,.8);
    margin-bottom:15px;
    animation:glow 2s ease-in-out infinite alternate;
}

min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;

    background:
    linear-gradient(rgba(6,20,43,0.75), rgba(6,20,43,0.75)),
    url("Sentry.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

..btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 40px;
    background:#00c3ff;
    color:white;
    border-radius:40px;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 0 20px rgba(0,195,255,.6);
    }

section{
    padding:50px 20px;
}

.card{
    background:#0d2348;
    margin:30px auto;
    padding:25px;
    border-radius:15px;
    width:85%;
    max-width:700px;
    border:1px solid #00c3ff;
    box-shadow:0 0 20px rgba(0,195,255,.3);
    transition:0.3s;
    }
    .card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 30px rgba(0,195,255,.7);
    }

footer{
    background:#08192f;
    padding:20px;
    color:#aaa;
}
    @keyframes glow{
    from{
        text-shadow:0 0 10px #00c3ff;
    }
    to{
        text-shadow:0 0 30px #00c3ff,0 0 50px #00c3ff;
    }
    }
</style>

</head>
<body>

<header>
    <img src="logo.png" class="logo" alt="EFootball Mania Logo">

    <h1>EFootball Mania</h1>

    <nav>
    <a href="index.html">Home</a>
    <a href="tournaments.html">Tournaments</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="contact.html">Contact</a>
    </nav>
    
</header>

<section>
<div class="hero">
    <h1>EFootball Mania</h1>
    <p>The Ultimate eFootball Tournament Platform</p>
    <a href="tournaments.html" class="btn">Join Tournament</a>
</div>
    
    </div>

    <div class="card">
        <h2>🏆 Upcoming Tournament</h2>
        <p>Coming Soon...</p>
    </div>

    <div class="card">
        <h2>👑 Leaderboard</h2>
        <p>Top Players will appear here.</p>
    </div>

</section>

<footer>
    © 2026 EFootball Mania. All Rights Reserved.
</footer>

</body>
</html>
